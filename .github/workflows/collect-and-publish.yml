name: Collect Shaanxi policies and publish daily report

on:
  schedule:
    # 08:35 Beijing. GitHub may start scheduled jobs later than this time.
    - cron: '35 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-publication
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: policy-data
          path: .snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e '.[test]'
          pytest -q
      - name: Collect official policies and build report
        run: python -m shaanxi_policy --state .snapshot/state.json --output .snapshot/site
      - name: Preserve incremental state and report history
        working-directory: .snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json site
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update official policy snapshot and daily report'
            git push origin HEAD:policy-data
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .snapshot/site
      - name: Report collection health
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open('.snapshot/site/latest.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Report: {r['report_url']}\n\nCounts: {r['counts']}\n")
          PY

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish policy report
        id: deployment
        uses: actions/deploy-pages@v4
